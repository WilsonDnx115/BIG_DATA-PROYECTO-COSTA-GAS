AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Costa Gas Trujillo - Data Lake medallon (Bronze/Silver/Gold) en S3 con Lambda,
  Glue Spark y Athena. Tope de costo US$ 1. Region us-east-2 (ADR 0011).
  Sin KMS propio, sin crawlers, sin VPC, sin NAT, sin EC2 (costos fijos).

Parameters:
  Sufijo:
    Type: String
    Description: Sufijo unico del bucket (p. ej. iniciales del equipo + fecha)
    AllowedPattern: "[a-z0-9-]{3,20}"
  Correo1:
    Type: String
    Description: Correo que recibe las alertas de AWS Budgets (obligatorio)
    AllowedPattern: "[^@\\s]+@[^@\\s]+"
  Correo2:
    Type: String
    Default: ""
    Description: Segundo correo de alertas (opcional)
  Correo3:
    Type: String
    Default: ""
    Description: Tercer correo de alertas (opcional)
  Correo4:
    Type: String
    Default: ""
    Description: Cuarto correo de alertas (opcional)
  CodigoKey:
    Type: String
    Default: _code/costagas_src.zip
    Description: Zip con src/, contracts/ y dependencias subido por deploy.sh
  LambdaMemoriaMB:
    Type: Number
    Default: 3008
    AllowedValues: [1024, 3008, 10240]
    Description: 3 GB para los Excel grandes (uno pesa 62 MB); 10 GB solo en la prueba de escalabilidad (3.7)
  GlueTrabajadores:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 5
    Description: 2 normal; 5 solo en la prueba de escalabilidad 100x
  PandasLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-2:336392948345:layer:AWSSDKPandas-Python312:29
    Description: Capa gestionada AWS SDK for pandas 3.16 para us-east-2 (verificada el 2026-10-10)

  EstadoReglaGold:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Regla que lanza el flujo de Gold. DISABLED durante la carga inicial de los 35 archivos (informe v15, X2):
      se activa despues, para no lanzar una corrida por cada lote de 10 archivos.
  RepoGithub:
    Type: String
    Default: WilsonDnx115/BIG_DATA-PROYECTO-COSTA-GAS
    Description: Repositorio que puede asumir el rol de despliegue por OIDC (solo la rama main)

Conditions:
  HayCorreo2: !Not [!Equals [!Ref Correo2, ""]]
  HayCorreo3: !Not [!Equals [!Ref Correo3, ""]]
  HayCorreo4: !Not [!Equals [!Ref Correo4, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # (1) Bucket del lago. Costo: S3 Standard ~US$ 0.023/GB-mes -> < US$ 0.01 con ~0.2 GB.
  # ---------------------------------------------------------------------------
  Lago:
    Type: AWS::S3::Bucket
    DependsOn: [PermisoS3InvocaLambda, PermisoS3InvocaIngesta]
    Properties:
      BucketName: !Sub costagas-trujillo-lake-${Sufijo}
      VersioningConfiguration: { Status: Suspended }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }   # SSE-S3, sin costo
      LifecycleConfiguration:
        Rules:
          - { Id: borrar-athena-results, Status: Enabled, Prefix: athena-results/, ExpirationInDays: 7 }
          - { Id: borrar-scaletest, Status: Enabled, Prefix: scaletest/, ExpirationInDays: 3 }
          - { Id: borrar-sparkui, Status: Enabled, Prefix: sparkui/, ExpirationInDays: 30 }
          - { Id: borrar-sim, Status: Enabled, Prefix: sim/, ExpirationInDays: 30 }    # datos sinteticos del detector
          - { Id: borrar-op, Status: Enabled, Prefix: op/, ExpirationInDays: 30 }      # lago de la operacion mensual
      NotificationConfiguration:
        EventBridgeConfiguration: { EventBridgeEnabled: true }   # eventos de S3 hacia EventBridge (gratis)
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt BronzeToSilver.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: bronze/interno/ }
          # W02/W03: la entrega llega a landing/ y la operacion mensual a op/landing/.
          - Event: s3:ObjectCreated:*
            Function: !GetAtt Ingesta.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: landing/ }
          - Event: s3:ObjectCreated:*
            Function: !GetAtt Ingesta.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: op/landing/ }

  # (3.8.3) Rechazo de peticiones sin TLS
  PoliticaLago:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Lago
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}
              - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/*
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # ---------------------------------------------------------------------------
  # (2) Rol de Lambda: lee solo bronze/interno/*, escribe silver/*. Sin costo.
  #     Informe v6, Tabla 3.12: un rol por servicio con acceso solo a su prefijo.
  # ---------------------------------------------------------------------------
  RolLambda:
    Type: AWS::IAM::Role
    Properties:
      RoleName: costagas-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: bronze-interno-lectura-silver-escritura
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/bronze/interno/*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/silver/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}
                Condition: { StringLike: { s3:prefix: ["bronze/interno/*", "silver/*"] } }
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/costagas/seudonimo/sal
              - Effect: Allow                      # destino en caso de falla (Tabla 2.11)
                Action: sqs:SendMessage
                Resource: !GetAtt ColaEventosFallidos.Arn

  # Lambda Bronze -> Silver (pandas). Costo: capa gratuita (400 000 GB-s/mes).
  BronzeToSilver:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: costagas-bronze-to-silver
      Runtime: python3.12
      Handler: src.silver.procesar.lambda_handler
      Role: !GetAtt RolLambda.Arn
      MemorySize: !Ref LambdaMemoriaMB
      Timeout: 900
      EphemeralStorage: { Size: 1024 }
      Layers: [!Ref PandasLayerArn]
      Code:
        S3Bucket: !Sub costagas-code-${Sufijo}
        S3Key: !Ref CodigoKey
      Environment:
        Variables:
          LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}
          SSM_PARAM_SAL: /costagas/seudonimo/sal

  PermisoS3InvocaLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BronzeToSilver
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}
      SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------------------
  # (2b) Ingesta de landing/ a Bronze (W02). Rol de minimo privilegio: lee solo
  #      landing/, escribe solo bronze/, op/bronze/ y _manifests/. Sin costo.
  # ---------------------------------------------------------------------------
  RolIngesta:
    Type: AWS::IAM::Role
    Properties:
      RoleName: costagas-ingesta-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: landing-lectura-bronze-escritura
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/landing/*
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/op/landing/*
              - Effect: Allow                      # Bronze es inmutable: no hay DeleteObject
                Action: s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/bronze/*
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/op/bronze/*
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/_manifests/*
              - Effect: Allow                      # la huella ya cargada se busca listando claves
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}
                Condition:
                  StringLike:
                    s3:prefix: ["landing/*", "op/landing/*", "_manifests/*"]
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ColaEventosFallidos.Arn

  # Costo: capa gratuita (400 000 GB-s/mes). 35 archivos x 300 s x 0.5 GB = 5 250 GB-s.
  Ingesta:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: costagas-ingesta
      Runtime: python3.12
      Handler: src.ingest.lambda_ingesta.lambda_handler
      Role: !GetAtt RolIngesta.Arn
      MemorySize: 512
      Timeout: 300
      EphemeralStorage: { Size: 1024 }     # /tmp para la copia local: el Excel mas grande pesa 62 MB
      Layers: [!Ref PandasLayerArn]        # openpyxl, para contar las filas en el manifiesto
      Code:
        S3Bucket: !Sub costagas-code-${Sufijo}
        S3Key: !Ref CodigoKey
      Environment:
        Variables:
          LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}

  PermisoS3InvocaIngesta:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Ingesta
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}
      SourceAccount: !Ref AWS::AccountId

  # Una extension fuera de _archivos.yaml levanta excepcion y el evento termina en la cola.
  DestinoFallasIngesta:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Ingesta
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      DestinationConfig: { OnFailure: { Destination: !GetAtt ColaEventosFallidos.Arn } }

  AlarmaErrorIngesta:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: costagas-error-ingesta
      AlarmDescription: Errores de la Lambda costagas-ingesta
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Ingesta }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TemaOperacion]

  # ---------------------------------------------------------------------------
  # (3) Rol de Glue: lee bronze/externo/* y silver/*; escribe silver/* y gold/*.
  # ---------------------------------------------------------------------------
  RolGlue:
    Type: AWS::IAM::Role
    Properties:
      RoleName: costagas-glue-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: glue.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: externo-silver-gold
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/bronze/externo/*
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/silver/*
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/gold/*
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/scaletest/*
                  - !Sub arn:aws:s3:::costagas-code-${Sufijo}/*
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/silver/*
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/gold/*
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/sparkui/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}
                  - !Sub arn:aws:s3:::costagas-code-${Sufijo}
              - Effect: Allow                      # aviso al negocio (Tabla 2.11)
                Action: sns:Publish
                Resource: !Ref TemaNegocio

  # Job Glue Spark (informe v15, Tabla 2.7c): 2 trabajadores G.1X fijos, clase estandar para las corridas por
  # evento (las de prueba se lanzan en FLEX con start-job-run --execution-class FLEX), 15 min, una corrida a la
  # vez con cola (la segunda espera en lugar de fallar) e Iceberg en el catalogo glue_catalog.
  # Glue exige MaxRetries = 0 cuando la cola de corridas esta activa (verificado al desplegar el 25/11/2026):
  # la corrida fallida avisa por SNS (costagas-glue-fallido) y la siguiente la recupera con los marcadores.
  # Costo: US$ 0.44/DPU-h estandar -> ~US$ 0.044 por corrida de 3 min con 2 DPU; FLEX US$ 0.29/DPU-h.
  JobConciliacion:
    Type: AWS::Glue::Job
    Properties:
      Name: costagas-gold-conciliacion
      Role: !GetAtt RolGlue.Arn
      GlueVersion: "5.0"
      WorkerType: G.1X
      NumberOfWorkers: !Ref GlueTrabajadores
      ExecutionClass: STANDARD
      Timeout: 15
      MaxRetries: 0
      ExecutionProperty: { MaxConcurrentRuns: 1 }
      JobRunQueuingEnabled: true
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub s3://costagas-code-${Sufijo}/_code/glue_conciliacion.py
      DefaultArguments:
        --extra-py-files: !Sub s3://costagas-code-${Sufijo}/${CodigoKey}
        --LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}
        --ANIO: "todos"
        --enable-spark-ui: "true"
        --spark-event-logs-path: !Sub s3://costagas-trujillo-lake-${Sufijo}/sparkui/
        --enable-glue-datacatalog: "true"
        --enable-metrics: "true"
        --job-bookmark-option: job-bookmark-enable
        --datalake-formats: iceberg
        --conf: !Sub >-
          spark.sql.adaptive.enabled=true --conf spark.sql.adaptive.skewJoin.enabled=true
          --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
          --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.catalog.glue_catalog.warehouse=s3://costagas-trujillo-lake-${Sufijo}/gold/

  # ---------------------------------------------------------------------------
  # (4) Catalogo: una base por capa. Tablas por DDL (sql/athena/ddl), sin crawlers. Sin costo.
  # ---------------------------------------------------------------------------
  BaseSilver:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput: { Name: costagas_silver }
  BaseGold:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput: { Name: costagas_gold }

  # ---------------------------------------------------------------------------
  # (5) Workgroup de Athena: 1 GB maximo por consulta. Costo: US$ 5/TB escaneado.
  # ---------------------------------------------------------------------------
  WorkgroupAthena:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: costagas-wg
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 1073741824
        PublishCloudWatchMetricsEnabled: false
        ResultConfiguration:
          OutputLocation: !Sub s3://costagas-trujillo-lake-${Sufijo}/athena-results/
          EncryptionConfiguration: { EncryptionOption: SSE_S3 }

  # ---------------------------------------------------------------------------
  # (6) Presupuesto con alertas en US$ 0.50 y US$ 1.00 a los correos del equipo.
  #     Los 2 primeros presupuestos de la cuenta no cuestan.
  # ---------------------------------------------------------------------------
  Presupuesto:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: costagas-tope-1usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 1, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref Correo1 }
            - !If [HayCorreo2, { SubscriptionType: EMAIL, Address: !Ref Correo2 }, !Ref "AWS::NoValue"]
            - !If [HayCorreo3, { SubscriptionType: EMAIL, Address: !Ref Correo3 }, !Ref "AWS::NoValue"]
            - !If [HayCorreo4, { SubscriptionType: EMAIL, Address: !Ref Correo4 }, !Ref "AWS::NoValue"]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref Correo1 }
            - !If [HayCorreo2, { SubscriptionType: EMAIL, Address: !Ref Correo2 }, !Ref "AWS::NoValue"]
            - !If [HayCorreo3, { SubscriptionType: EMAIL, Address: !Ref Correo3 }, !Ref "AWS::NoValue"]
            - !If [HayCorreo4, { SubscriptionType: EMAIL, Address: !Ref Correo4 }, !Ref "AWS::NoValue"]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref Correo1 }
            - !If [HayCorreo2, { SubscriptionType: EMAIL, Address: !Ref Correo2 }, !Ref "AWS::NoValue"]
            - !If [HayCorreo3, { SubscriptionType: EMAIL, Address: !Ref Correo3 }, !Ref "AWS::NoValue"]
            - !If [HayCorreo4, { SubscriptionType: EMAIL, Address: !Ref Correo4 }, !Ref "AWS::NoValue"]

  # ---------------------------------------------------------------------------
  # (7) Ambiente automatizado (informe v15, Tabla 2.11): SNS, SQS, alarmas y regla de fallas de Glue.
  #     Costo: capas siempre gratuitas (1 000 correos SNS, 1 M solicitudes SQS, 10 alarmas al mes).
  # ---------------------------------------------------------------------------
  TemaOperacion:
    Type: AWS::SNS::Topic
    Properties: { TopicName: costagas-alertas-operacion, DisplayName: CostaGas operacion }
  TemaNegocio:
    Type: AWS::SNS::Topic
    Properties: { TopicName: costagas-alertas-negocio, DisplayName: CostaGas negocio }

  # Solo CloudWatch y EventBridge publican en operacion; el rol de Glue publica en negocio por su politica.
  # Budgets avisa por correo directo a los cuatro integrantes (informe v16, Tabla 2.11).
  PoliticaTemaOperacion:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref TemaOperacion]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ServiciosQuePublican
            Effect: Allow
            Principal: { Service: [cloudwatch.amazonaws.com, events.amazonaws.com] }
            Action: sns:Publish
            Resource: !Ref TemaOperacion
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }

  # Suscripciones por correo: cada integrante confirma la suya desde el correo que envia AWS.
  SubOperacion1: { Type: AWS::SNS::Subscription, Properties: { TopicArn: !Ref TemaOperacion, Protocol: email, Endpoint: !Ref Correo1 } }
  SubOperacion2: { Type: AWS::SNS::Subscription, Condition: HayCorreo2, Properties: { TopicArn: !Ref TemaOperacion, Protocol: email, Endpoint: !Ref Correo2 } }
  SubOperacion3: { Type: AWS::SNS::Subscription, Condition: HayCorreo3, Properties: { TopicArn: !Ref TemaOperacion, Protocol: email, Endpoint: !Ref Correo3 } }
  SubOperacion4: { Type: AWS::SNS::Subscription, Condition: HayCorreo4, Properties: { TopicArn: !Ref TemaOperacion, Protocol: email, Endpoint: !Ref Correo4 } }
  SubNegocio1: { Type: AWS::SNS::Subscription, Properties: { TopicArn: !Ref TemaNegocio, Protocol: email, Endpoint: !Ref Correo1 } }

  ColaEventosFallidos:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: costagas-eventos-fallidos
      MessageRetentionPeriod: 1209600      # 14 dias
      SqsManagedSseEnabled: true

  # Lambda reintenta 2 veces cada invocacion asincrona; lo que no se recupera va a la cola.
  DestinoFallasLimpieza:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref BronzeToSilver
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      DestinationConfig: { OnFailure: { Destination: !GetAtt ColaEventosFallidos.Arn } }

  AlarmaErrorLimpieza:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: costagas-error-limpieza
      AlarmDescription: Errores de la Lambda costagas-bronze-to-silver
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref BronzeToSilver }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TemaOperacion]
  AlarmaEventosFallidos:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: costagas-eventos-fallidos
      AlarmDescription: Hay eventos en la cola costagas-eventos-fallidos
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt ColaEventosFallidos.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TemaOperacion]

  ReglaGlueFallido:
    Type: AWS::Events::Rule
    Properties:
      Name: costagas-glue-fallido
      Description: Corrida de Glue fallida, vencida o con error -> correo al equipo
      EventPattern:
        source: [aws.glue]
        detail-type: [Glue Job State Change]
        detail:
          jobName: [costagas-gold-conciliacion, costagas-externos]
          state: [FAILED, TIMEOUT, ERROR]
      Targets: [{ Id: tema-operacion, Arn: !Ref TemaOperacion }]

  # ---------------------------------------------------------------------------
  # (8) Flujo por eventos de Gold (informe v15, X1 y X2). La regla escucha SOLO los prefijos de Silver de las
  #     entregas internas: lo que escriben los jobs de Glue (gold/, gold/mr/, silver/entorno/) no la dispara,
  #     asi que una corrida nunca lanza otra. Costo: EventBridge no cobra eventos de S3; el flujo no cobra.
  # ---------------------------------------------------------------------------
  FlujoGold:
    Type: AWS::Glue::Workflow
    Properties: { Name: costagas-flujo-gold, Description: Gold por eventos de Silver interno (10 eventos o 60 s) }
  DisparadorGold:
    Type: AWS::Glue::Trigger
    Properties:
      Name: costagas-al-actualizar-silver
      Type: EVENT
      WorkflowName: !Ref FlujoGold
      EventBatchingCondition: { BatchSize: 10, BatchWindow: 60 }
      Actions: [{ JobName: !Ref JobConciliacion }]

  RolEventos:
    Type: AWS::IAM::Role
    Properties:
      RoleName: costagas-eventos-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: events.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: notificar-flujo-gold
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: glue:notifyEvent
                Resource: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/costagas-flujo-gold

  ReglaSilverActualizado:
    Type: AWS::Events::Rule
    Properties:
      Name: costagas-silver-actualizado
      Description: Silver de entregas internas actualizado -> flujo costagas-flujo-gold
      State: !Ref EstadoReglaGold
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket: { name: [!Ref Lago] }
          object:
            key:
              - { prefix: silver/compras/ }
              - { prefix: silver/ventas/ }
              - { prefix: silver/ventas_unidad/ }
              - { prefix: silver/gastos/ }
              - { prefix: silver/flota/ }
              - { prefix: silver/maestros/ }
              - { prefix: silver/produccion/ }
      Targets:
        - Id: flujo-gold
          Arn: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/costagas-flujo-gold
          RoleArn: !GetAtt RolEventos.Arn

  # ---------------------------------------------------------------------------
  # (9) Portal web (informe v15, M9): bucket privado detras de CloudFront con OAC e inicio de sesion de Cognito.
  #     Costo: capa gratuita (CloudFront 1 TB/mes, Cognito 10 000 usuarios activos/mes); S3 de pocos KB.
  # ---------------------------------------------------------------------------
  BucketPortal:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub costagas-portal-${Sufijo}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
  AccesoOrigenPortal:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub costagas-portal-oac-${Sufijo}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  DistribucionPortal:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Portal web costagas (solo HTTPS)
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: portal
            DomainName: !GetAtt BucketPortal.RegionalDomainName
            OriginAccessControlId: !GetAtt AccesoOrigenPortal.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: portal
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # politica administrada CachingOptimized
  PoliticaPortal:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketPortal
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloCloudFront
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::costagas-portal-${Sufijo}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistribucionPortal}
          - Sid: SoloTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub arn:aws:s3:::costagas-portal-${Sufijo}
              - !Sub arn:aws:s3:::costagas-portal-${Sufijo}/*
            Condition: { Bool: { aws:SecureTransport: "false" } }

  GrupoUsuariosPortal:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: costagas-portal
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }    # sin autorregistro
      Policies:
        PasswordPolicy: { MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: admin_only, Priority: 1 }]
  ClientePortal:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: costagas-portal-web
      UserPoolId: !Ref GrupoUsuariosPortal
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED

  # ---------------------------------------------------------------------------
  # (10) Entrega continua (informe v15, Tabla 2.12): GitHub Actions entra por OIDC, sin claves guardadas,
  #      solo desde la rama main del repositorio. Tiene los permisos de ingenieria de datos y las
  #      denegaciones de costagas-base. Sin costo.
  # ---------------------------------------------------------------------------
  ProveedorGithub:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]
  RolDespliegueGithub:
    Type: AWS::IAM::Role
    Properties:
      RoleName: costagas-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref ProveedorGithub }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: { token.actions.githubusercontent.com:aud: sts.amazonaws.com }
              StringLike: { token.actions.githubusercontent.com:sub: !Sub "repo:${RepoGithub}:ref:refs/heads/main" }
      ManagedPolicyArns:
        - !Sub arn:aws:iam::${AWS::AccountId}:policy/costagas-ingenieria-datos
        - !Sub arn:aws:iam::${AWS::AccountId}:policy/costagas-base

  # ---------------------------------------------------------------------------
  # (10) Extractores de fuentes externas (W20, informe seccion 2.4 y Tabla 2.5).
  #      Cinco funciones que dejan el crudo en landing/externo/<fuente>/. Ese
  #      prefijo lo ignora la Lambda de ingesta: no es la entrega interna y no
  #      va a Bronze interno.
  #      Costo: capa gratuita. Las cuatro programadas suman unas 70 invocaciones
  #      al mes de pocos segundos; la de GDELT se invoca a mano una sola vez.
  #      Las fallas van a costagas-eventos-fallidos, que ya tiene su alarma
  #      (AlarmaEventosFallidos), asi que no se agrega una alarma por funcion.
  # ---------------------------------------------------------------------------
  RolExtractores:
    Type: AWS::IAM::Role
    Properties:
      RoleName: costagas-extractores-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: solo-escritura-en-landing-externo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow                      # no leen nada del lago: solo depositan
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/landing/externo/*
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ColaEventosFallidos.Arn

  # La clave de YouTube se lee de SSM en cada invocacion y nunca se versiona;
  # por eso esta funcion tiene su propio rol: es la unica con ssm:GetParameter.
  RolExtractorYoutube:
    Type: AWS::IAM::Role
    Properties:
      RoleName: costagas-extractor-youtube-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: landing-externo-y-clave-de-youtube
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/landing/externo/youtube/*
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/costagas/youtube/api_key
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ColaEventosFallidos.Arn

  ExtractorBcrp:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: costagas-extractor-bcrp
      Runtime: python3.12
      Handler: src.extractores.bcrp.lambda_handler
      Role: !GetAtt RolExtractores.Arn
      MemorySize: 256
      Timeout: 60
      Code:
        S3Bucket: !Sub costagas-code-${Sufijo}
        S3Key: !Ref CodigoKey
      Environment:
        Variables:
          LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}

  ExtractorFacilito:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: costagas-extractor-facilito
      Runtime: python3.12
      Handler: src.extractores.facilito.lambda_handler
      Role: !GetAtt RolExtractores.Arn
      MemorySize: 256
      Timeout: 120
      Code:
        S3Bucket: !Sub costagas-code-${Sufijo}
        S3Key: !Ref CodigoKey
      Environment:
        Variables:
          LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}

  ExtractorYoutube:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: costagas-extractor-youtube
      Runtime: python3.12
      Handler: src.extractores.youtube.lambda_handler
      Role: !GetAtt RolExtractorYoutube.Arn
      MemorySize: 256
      Timeout: 120
      Code:
        S3Bucket: !Sub costagas-code-${Sufijo}
        S3Key: !Ref CodigoKey
      Environment:
        Variables:
          LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}
          SSM_PARAM_YOUTUBE: /costagas/youtube/api_key

  # Carga historica de 2020: ~35 000 zip de pocos KB que salen en bloques gzip
  # de ~128 MB. Sin programa: se invoca a mano por ano (evento {"anio": 2020}).
  ExtractorGdelt:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: costagas-extractor-gdelt
      Runtime: python3.12
      Handler: src.extractores.gdelt.lambda_handler
      Role: !GetAtt RolExtractores.Arn
      MemorySize: 2048                     # el bloque se arma en memoria antes de comprimirlo
      Timeout: 900
      EphemeralStorage: { Size: 1024 }
      Code:
        S3Bucket: !Sub costagas-code-${Sufijo}
        S3Key: !Ref CodigoKey
      Environment:
        Variables:
          LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}
          TAMANO_OBJETIVO_MB: "128"

  ExtractorResoluciones:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: costagas-extractor-resoluciones
      Runtime: python3.12
      Handler: src.extractores.resoluciones.lambda_handler
      Role: !GetAtt RolExtractores.Arn
      MemorySize: 512
      Timeout: 300
      Code:
        S3Bucket: !Sub costagas-code-${Sufijo}
        S3Key: !Ref CodigoKey
      Environment:
        Variables:
          LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}

  FallasExtractorBcrp:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ExtractorBcrp
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      DestinationConfig: { OnFailure: { Destination: !GetAtt ColaEventosFallidos.Arn } }

  FallasExtractorFacilito:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ExtractorFacilito
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      DestinationConfig: { OnFailure: { Destination: !GetAtt ColaEventosFallidos.Arn } }

  FallasExtractorYoutube:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ExtractorYoutube
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      DestinationConfig: { OnFailure: { Destination: !GetAtt ColaEventosFallidos.Arn } }

  FallasExtractorResoluciones:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ExtractorResoluciones
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      DestinationConfig: { OnFailure: { Destination: !GetAtt ColaEventosFallidos.Arn } }

  # Los extractores los programa EventBridge Scheduler (informe M1 y ADR 0015),
  # no una regla de EventBridge Events: Scheduler es el servicio de horarios y
  # trae su propia politica de reintento y su cola de fallas por programa.
  RolExtractoresScheduler:
    Type: AWS::IAM::Role
    Properties:
      RoleName: costagas-extractores-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invocar-solo-los-extractores
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ExtractorBcrp.Arn
                  - !GetAtt ExtractorFacilito.Arn
                  - !GetAtt ExtractorYoutube.Arn
                  - !GetAtt ExtractorResoluciones.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ColaEventosFallidos.Arn

  # El BCRP publica con un dia de rezago: a las 11:00 UTC (06:00 en Peru) la
  # serie del dia anterior ya esta.
  ProgramaBcrpDiario:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: costagas-bcrp-diario
      Description: Tipo de cambio oficial del BCRP, una vez al dia
      State: ENABLED
      ScheduleExpression: cron(0 11 * * ? *)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt ExtractorBcrp.Arn
        RoleArn: !GetAtt RolExtractoresScheduler.Arn
        RetryPolicy: { MaximumRetryAttempts: 1 }
        DeadLetterConfig: { Arn: !GetAtt ColaEventosFallidos.Arn }

  ProgramaFacilitoSemanal:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: costagas-facilito-semanal
      Description: Precios de GLP de Facilito, los lunes (ADR 0024)
      State: ENABLED
      ScheduleExpression: cron(30 11 ? * MON *)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt ExtractorFacilito.Arn
        RoleArn: !GetAtt RolExtractoresScheduler.Arn
        RetryPolicy: { MaximumRetryAttempts: 1 }
        DeadLetterConfig: { Arn: !GetAtt ColaEventosFallidos.Arn }

  ProgramaYoutubeSemanal:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: costagas-youtube-semanal
      Description: Texto publico de YouTube, los lunes (ADR 0015)
      State: ENABLED
      ScheduleExpression: cron(45 11 ? * MON *)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt ExtractorYoutube.Arn
        RoleArn: !GetAtt RolExtractoresScheduler.Arn
        RetryPolicy: { MaximumRetryAttempts: 1 }
        DeadLetterConfig: { Arn: !GetAtt ColaEventosFallidos.Arn }

  ProgramaResolucionesMensual:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: costagas-resoluciones-mensual
      Description: Resoluciones de Osinergmin en PDF, el dia 1 de cada mes (ADR 0024)
      State: ENABLED
      ScheduleExpression: cron(0 12 1 * ? *)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt ExtractorResoluciones.Arn
        RoleArn: !GetAtt RolExtractoresScheduler.Arn
        RetryPolicy: { MaximumRetryAttempts: 1 }
        DeadLetterConfig: { Arn: !GetAtt ColaEventosFallidos.Arn }

  # ---------------------------------------------------------------------------
  # (11) Job de fuentes externas (W21): conteo de GDELT con MapReduce, texto de
  #      las resoluciones con pdfplumber, LDA de MLlib y gold.mercado_mes.
  #      2 trabajadores G.1X en FLEX, una corrida mensual: ~= US$ 0.03
  #      (Tabla 2.7a). Timeout de 15 minutos y MaxRetries 0, como el de Gold.
  # ---------------------------------------------------------------------------
  JobExternos:
    Type: AWS::Glue::Job
    Properties:
      Name: costagas-externos
      Role: !GetAtt RolGlue.Arn
      GlueVersion: "5.0"
      WorkerType: G.1X
      NumberOfWorkers: !Ref GlueTrabajadores
      ExecutionClass: FLEX              # mensual y sin hora fija: FLEX cuesta menos
      Timeout: 15
      MaxRetries: 0
      ExecutionProperty: { MaxConcurrentRuns: 1 }
      JobRunQueuingEnabled: true
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub s3://costagas-code-${Sufijo}/_code/glue_externos.py
      DefaultArguments:
        --extra-py-files: !Sub s3://costagas-code-${Sufijo}/${CodigoKey}
        --additional-python-modules: pdfplumber>=0.11
        --LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}
        --k: "5"
        --enable-spark-ui: "true"
        --spark-event-logs-path: !Sub s3://costagas-trujillo-lake-${Sufijo}/sparkui/
        --enable-glue-datacatalog: "true"
        --enable-metrics: "true"
        --job-bookmark-option: job-bookmark-enable
        --datalake-formats: iceberg
        --conf: !Sub >-
          spark.sql.adaptive.enabled=true --conf spark.sql.adaptive.skewJoin.enabled=true
          --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
          --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.catalog.glue_catalog.warehouse=s3://costagas-trujillo-lake-${Sufijo}/gold/

  # Dia 2 de cada mes a las 13:00 UTC: los extractores semanales y el de
  # resoluciones (dia 1) ya dejaron el mes completo en landing/externo/.
  ProgramaExternosMensual:
    Type: AWS::Glue::Trigger
    Properties:
      Name: costagas-externos-mensual
      Type: SCHEDULED
      Schedule: cron(0 13 2 * ? *)
      StartOnCreation: true
      Actions:
        - JobName: !Ref JobExternos
          Arguments:
            --LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}
          Timeout: 15
  # ---------------------------------------------------------------------------
  # (12) Funciones del portal (W22, informe M9 y M10). Cuatro Lambdas con URL de
  #      funcion: firmar la carga, estado del lago, KPI y revision documental.
  #      AuthType NONE con validacion del token de Cognito en el codigo
  #      (src/controles/jwt.py) y CORS limitado al dominio de CloudFront.
  #      Costo: capa gratuita (las invocaciones son de un operador, no de un
  #      publico). Las consultas de Athena del portal son las de desarrollo de
  #      la Tabla 2.7, de pocos KB escaneados.
  # ---------------------------------------------------------------------------
  RolPortal:
    Type: AWS::IAM::Role
    Properties:
      RoleName: costagas-portal-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: portal-firmar-consultar-y-revisar
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow                  # la URL prefirmada solo puede escribir aqui
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/landing/interno/*
              - Effect: Allow                  # estado del lago: manifiestos y calidad
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/_manifests/*
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/silver/_control/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}
                Condition:
                  StringLike:
                    s3:prefix: ["_manifests/*", "silver/_control/*"]
              - Effect: Allow                  # Gold de solo lectura, salvo revision_alerta
                Action: [s3:GetObject]
                Resource: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/gold/*
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/gold/revision_alerta/*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}/athena-results/*
                  - !Sub arn:aws:s3:::costagas-trujillo-lake-${Sufijo}
              - Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution,
                         athena:GetQueryResults, athena:StopQueryExecution]
                Resource: !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${WorkgroupAthena}
              - Effect: Allow                  # el catalogo, solo para leer el esquema
                Action: [glue:GetDatabase, glue:GetDatabases, glue:GetTable, glue:GetTables,
                         glue:GetPartition, glue:GetPartitions]
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/costagas_gold
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/costagas_gold/*
              - Effect: Allow
                Action: glue:UpdateTable       # Iceberg actualiza el puntero al insertar
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/costagas_gold
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/costagas_gold/revision_alerta
              - Effect: Allow
                Action: ssm:GetParameter       # la sal del seudonimo del revisor
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/costagas/seudonimo/sal

  PortalFirmar:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: costagas-portal-firmar
      Runtime: python3.12
      Handler: src.portal.firmar.lambda_handler
      Role: !GetAtt RolPortal.Arn
      MemorySize: 256
      Timeout: 10
      Code:
        S3Bucket: !Sub costagas-code-${Sufijo}
        S3Key: !Ref CodigoKey
      Environment:
        Variables:
          LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}
          LAKE_BUCKET: !Sub costagas-trujillo-lake-${Sufijo}
          COGNITO_USER_POOL_ID: !Ref GrupoUsuariosPortal
          COGNITO_CLIENT_ID: !Ref ClientePortal
          PORTAL_ORIGEN: !Sub https://${DistribucionPortal.DomainName}

  PortalEstado:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: costagas-portal-estado
      Runtime: python3.12
      Handler: src.portal.estado.lambda_handler
      Role: !GetAtt RolPortal.Arn
      MemorySize: 256
      Timeout: 30
      Code:
        S3Bucket: !Sub costagas-code-${Sufijo}
        S3Key: !Ref CodigoKey
      Environment:
        Variables:
          LAKE_URI: !Sub s3://costagas-trujillo-lake-${Sufijo}
          LAKE_BUCKET: !Sub costagas-trujillo-lake-${Sufijo}
          COGNITO_USER_POOL_ID: !Ref GrupoUsuariosPortal
          COGNITO_CLIENT_ID: !Ref ClientePortal
          PORTAL_ORIGEN: !Sub https://${DistribucionPortal.DomainName}

  PortalKpis:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: costagas-portal-kpis
      Runtime: python3.12
      Handler: src.portal.kpis.lambda_handler
      Role: !GetAtt RolPortal.Arn
      MemorySize: 256
      Timeout: 30
      Code:
