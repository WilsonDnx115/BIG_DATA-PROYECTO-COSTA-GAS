# Especificacion de PRUEBA del escenario B. No son los robos reales.
#
# Los robos reales nunca entran al repositorio: se entregan sellados a Ingenieria de
# datos para `sim/_spec/` y aqui solo queda su huella SHA-256
# (ver docs/modelos/formato_spec_b.md).
#
# Las entidades se nombran por rol y posicion («reparto#3»), no por placa: la
# validacion corre 100 semillas y cada una genera una flota distinta. Una placa
# literal tambien se acepta, pero solo serviria para una semilla.
version: 1
descripcion: Especificacion de prueba; cubre los seis tipos con magnitudes exageradas.

robos:
  - id: P1
    tipo: escalon
    entidad: reparto#3
    desde: 2021-03-01
    magnitud: 0.20
    nota: Caida brusca y sostenida en la unidad mas grande de la flota.

  - id: P2
    tipo: sangrado
    entidad: reparto#1
    desde: 2020-07-06
    hasta: 2022-12-26
    magnitud: 0.05
    nota: Constante y pequenio durante dos anios y medio; poco por semana, mucho al anio.

  - id: P3
    tipo: rampa
    entidad: reparto#4
    desde: 2021-06-07
    magnitud: 0.25
    semanas_rampa: 20
    nota: Empieza en cero y crece; al principio se confunde con el ruido normal.

  - id: P4
    tipo: pulsos
    entidad: reparto#5
    desde: 2021-01-04
    magnitud: 0.30
    cada_n_periodos: 4
    nota: Solo una semana de cada cuatro; el promedio mensual casi no se mueve.

  - id: P5
    tipo: canal
    entidad: "*"
    desde: 2022-01-03
    hasta: 2022-06-27
    magnitud: 0.04
    nota: Afecta a toda la flota a la vez, asi que comparar una unidad con el resto no lo ve.

  - id: P6
    tipo: a_la_sombra
    entidad: reparto#6
    desde: 2020-01-06
    magnitud: 0.35
    nota: >
      El tipo que el detector no tuvo en cuenta al disenarse: roba solo en las semanas
      que ya tienen un evento legitimo documentado, de modo que el salto queda explicado
      por el evento y nadie lo mira dos veces.
